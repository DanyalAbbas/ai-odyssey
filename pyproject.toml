[project]
name = "ai-odyssey"
version = "1.0.0"
description = "Face recognition pipeline for TechFest"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "scikit-image>=0.20.0",
    "pillow>=9.0.0",
    "insightface>=0.7.3",
    "onnxruntime>=1.16.0",
    "tqdm>=4.60.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
